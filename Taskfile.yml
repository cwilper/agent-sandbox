version: '3'

vars:
  # Machine name is intentionally shorter than the project name: smolvm uses
  # it as the guest's UTS hostname at every boot, and the prompt should read
  # agent@sandbox. IMAGE/TAR keep the project name.
  NAME: sandbox
  IMAGE: agent-sandbox
  TAR: agent-sandbox.tar
  SMOLFILE: Smolfile
  NET_BACKEND: virtio-net
  HOST_WORKSPACE: '{{.HOME}}/Work'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the Docker image and export it to {{.TAR}}
    sources:
      - Dockerfile
      - start-dockerd
      - agent-home/**/*
    generates:
      - '{{.TAR}}'
    cmds:
      - docker buildx build -t {{.IMAGE}} --load .
      - docker save {{.IMAGE}} -o {{.TAR}}

  create:
    desc: Create the VM from {{.TAR}}, configured by {{.SMOLFILE}}
    deps: [build]
    cmds:
      - >-
        smolvm machine create
        --name {{.NAME}}
        -s {{.SMOLFILE}}
        --image ./{{.TAR}}
        --net-backend {{.NET_BACKEND}}
        -v {{.HOST_WORKSPACE}}:/home/agent/Work

  start:
    desc: Start the VM and bring up dockerd inside it
    cmds:
      - smolvm machine start --name {{.NAME}}
      # Make sure our uid/gid match the host's
      - smolvm machine exec --name {{.NAME}} -- sudo fix-ownership
      # The /storage/docker bind-mount does not survive stop/start, so this is
      # required on every boot. The script is idempotent. sudo is needed
      # because exec lands as agent, and the mount and daemon need root.
      - smolvm machine exec --name {{.NAME}} -- sudo start-dockerd

  stop:
    desc: Stop the VM
    cmds:
      - smolvm machine stop --name {{.NAME}}

  delete:
    desc: Delete the VM
    deps: [stop]
    cmds:
      - smolvm machine delete -f --name {{.NAME}}

  shell:
    desc: Open an interactive zsh login shell in the VM as agent
    cmds:
      - smolvm machine exec -it --name {{.NAME}} -- zsh -l

  clean:
    desc: Remove the exported tarball and any packed artifacts
    cmds:
      - rm {{.TAR}} {{.NAME}} {{.NAME}}.smolmachine > /dev/null 2>&1 || echo
      - rm -rf .task > /dev/null 2>&1 || echo

  nuke:
    desc: Stop and delete the VM, clean artifacts, and remove the Docker image
    cmds:
      # Each step is best-effort: the VM may already be stopped, already gone,
      # or never created. Nothing here should abort the teardown.
      - cmd: smolvm machine stop --name {{.NAME}}
        ignore_error: true
      - cmd: smolvm machine delete -f --name {{.NAME}}
        ignore_error: true
      - task: clean
      - cmd: docker rmi -f {{.IMAGE}}
        ignore_error: true
